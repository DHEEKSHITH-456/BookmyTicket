{% extends 'users/basic.html' %}

{% block title %}Password Reset Complete — BookMyTicket{% endblock %}

{% block content %}
<div class="auth-page-wrap">
    <div class="auth-card" style="text-align:center;">
        <div class="auth-icon-circle" style="background:linear-gradient(135deg,#00b894,#55efc4);">
            <i class="fas fa-check-circle"></i>
        </div>
        <h2 style="margin:0 0 10px;color:#222;font-size:24px;font-weight:700;">Password Changed!</h2>
        <p style="color:#888;font-size:14px;line-height:1.6;margin:0 0 24px;">
            Your password has been successfully reset. You can now sign in with your new password.
        </p>
        <a href="{% url 'login' %}" class="auth-submit-btn" style="display:flex;text-decoration:none;">
            <i class="fas fa-sign-in-alt"></i> Sign In Now
        </a>
    </div>
</div>

<style>
    .auth-page-wrap {
        min-height: calc(100vh - 200px);
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f5f5;
        padding: 40px 20px;
    }
    .auth-card {
        background: #fff;
        max-width: 440px;
        width: 100%;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    .auth-icon-circle {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        color: #fff;
        font-size: 24px;
        box-shadow: 0 6px 20px rgba(0,184,148,0.3);
    }
    .auth-submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #F84464, #ff6b81);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 6px 20px rgba(248,68,100,0.25);
        transition: all 0.25s;
    }
    .auth-submit-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 28px rgba(248,68,100,0.35);
    }
</style>
{% endblock %}
